zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd api && npm install && npx prisma generate --schema=../prisma/schema.prisma
      deployFiles:
        - api
        - prisma
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm --prefix api run start:api
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - cd worker && npm install && npx prisma generate --schema=../prisma/schema.prisma
      deployFiles:
        - worker
        - prisma
        - node_modules
    run:
      base: nodejs@22
      start: npm --prefix worker run start:worker
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm install && export VITE_API_URL=$RUNTIME_FRONTEND_API_URL && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static