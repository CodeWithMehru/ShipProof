zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - npm install
        - npx prisma generate --schema=../prisma/schema.prisma
        - npm run build
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        JWT_SECRET: ${JWT_SECRET}
        NODE_ENV: production
