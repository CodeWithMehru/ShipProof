zerops:
  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - npm install
        - npx prisma generate --schema=../prisma/schema.prisma
        - npm run build
      deployFiles: ./
      cache:
        - node_modules
    run:
      base: nodejs@22
      start: npm run start
      envVariables:
        DATABASE_URL: ${db_connectionString}
        REDIS_URL: ${cache_connectionString}
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        EVENT_START: ${EVENT_START}
        EVENT_END: ${EVENT_END}
        JUDGING_END: ${JUDGING_END}
        NODE_ENV: production
